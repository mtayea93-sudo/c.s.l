name: csl-diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check CSL cloud data
        run: |
          python3 - <<'PY'
          import json, urllib.request
          KEY = "AIzaSyAPawpCwihRHOaPjMzhhcsSDa9WAy0Qx-Q"
          DB = "https://sakrlab2026-default-rtdb.firebaseio.com"
          def req(url, data=None):
              r = urllib.request.Request(url, data=json.dumps(data).encode() if data else None,
                                         headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as f:
                      return json.loads(f.read() or b"null")
              except Exception as e:
                  return {"__err": str(e)[:200]}
          tok = req(f"https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={KEY}", {"returnSecureToken": True})
          if "idToken" not in tok:
              print("AUTH_FAILED", tok); raise SystemExit(0)
          t = tok["idToken"]
          print("AUTH OK")
          root = req(f"{DB}/.json?auth={t}&shallow=true")
          print("ROOT KEYS:", json.dumps(root, ensure_ascii=False)[:1200])
          csl = req(f"{DB}/csl.json?auth={t}&shallow=true")
          print("CSL KEYS:", json.dumps(csl, ensure_ascii=False)[:600])
          sakr = req(f"{DB}/sakr.json?auth={t}&shallow=true")
          print("SAKR KEYS:", json.dumps(sakr, ensure_ascii=False)[:600])
          users = req(f"{DB}/users.json?auth={t}&shallow=true")
          if isinstance(users, dict) and "__err" not in users:
              print("USERS COUNT:", len(users))
          bookings = req(f"{DB}/bookings.json?auth={t}&shallow=true")
          if isinstance(bookings, dict) and "__err" not in bookings:
              print("BOOKINGS COUNT:", len(bookings))
PY
