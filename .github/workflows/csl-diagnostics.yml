name: csl-diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read Firebase (no secrets printed)
        run: |
          node <<'EOF'
          const https=require('https');
          const cfg={apiKey:"AIzaSyAyKccEYlPnFglDQDApy6gG-jApwcKe4Ks",databaseURL:"https://sakrlab2026-default-rtdb.firebaseio.com",authDomain:"sakrlab2026.firebaseapp.com"};
          const post=(p,b)=>new Promise((res,rej)=>{const r=https.request({hostname:"identitytoolkit.googleapis.com",path:p,method:"POST",headers:{"Content-Type":"application/json","Content-Length":Buffer.byteLength(b)}},x=>{let d="";x.on("data",c=>d+=c);x.on("end",()=>res(JSON.parse(d)))});r.on("error",rej);r.write(b);r.end()});
          const get=p=>new Promise((res,rej)=>{https.get({hostname:"sakrlab2026-default-rtdb.firebaseio.com",path:p+"?auth="+encodeURIComponent(IDTOKEN)},x=>{let d="";x.on("data",c=>d+=c);x.on("end",()=>res(JSON.parse(d)))}).on("error",rej)});
          let IDTOKEN=null;
          (async()=>{
            const a=await post("/v1/accounts:signUp?key="+cfg.apiKey,JSON.stringify({returnSecureToken:true}));
            if(a.error){console.log("AUTH ERR",a.error.message);process.exit(0)}
            IDTOKEN=a.idToken;
            const snap=await get("/csl.json");
            console.log("ROOT KEYS:",JSON.stringify(Object.keys(snap||{})));
            const meta=snap&&snap.meta;
            if(!meta){console.log("NO META NODE");process.exit(0)}
            console.log("META v:",meta.v,"at:",meta.at,"labsCount:",meta.labs?meta.labs.length:0);
            (meta.labs||[]).forEach(l=>console.log("LAB:",l.id,"|",l.name,"| active:",l.active,"| patients:",l.casa?l.casa.patients:0,"| visits:",l.casa?l.casa.visits:0,"| payments:",l.casa?l.casa.payments:0,"| at:",l.at));
            const labsNode=snap.labs||{};
            console.log("LABS NODE IDS:",JSON.stringify(Object.keys(labsNode)));
            for(const id of Object.keys(labsNode)){
              const n=labsNode[id];
              console.log("  labs/"+id,"v:",n&&n.v,"at:",n&&n.at,"(db size chars:",n&&n.db?JSON.stringify(n.db).length:0,")");
            }
          })().catch(e=>{console.log("ERR",e.message)});
          EOF
